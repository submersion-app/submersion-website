name: Sync legal pages

# The legal text has one home: PRIVACY.md and TERMS.md in
# submersion-app/submersion. This workflow regenerates the pages here from
# them so the site cannot drift out of step with the app's own policies,
# which is what happened before: the app repo's privacy policy was rewritten
# while the published page kept serving a version months out of date. A store
# listing that links a policy contradicting the app's Data safety declaration
# is a policy violation, so the drift was not cosmetic.
#
# Triggers:
#   schedule            a daily floor, so a missed dispatch still converges
#   workflow_dispatch   manual "sync it now"
#   repository_dispatch the app repo can push a `legal-updated` event to make
#                       a change land here within a minute
#   push                template or renderer changes regenerate immediately
#
# The push trigger cannot loop: the sync job commits only when a rendered
# page differs, so the commit it makes produces a run that finds no change
# and stops.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [legal-updated]
  push:
    branches: [main]
    paths:
      - tools/render_legal.py
      - privacy/index.html
      - terms/index.html
      - .github/workflows/sync-legal.yml
  pull_request:
    paths:
      - tools/render_legal.py
      - privacy/index.html
      - terms/index.html
      - .github/workflows/sync-legal.yml

# Where the source documents live. Kept here rather than inline so the two
# jobs cannot disagree about it.
env:
  SOURCE_REPO: https://raw.githubusercontent.com/submersion-app/submersion/main

permissions:
  contents: read

jobs:
  # On a pull request, verify rather than write. This is what stops someone
  # hand-editing a generated region: the edit would be silently reverted by
  # the next sync, so the PR fails and says why instead.
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the source documents
        run: |
          curl -fsSL --retry 3 "$SOURCE_REPO/PRIVACY.md" -o /tmp/PRIVACY.md
          curl -fsSL --retry 3 "$SOURCE_REPO/TERMS.md" -o /tmp/TERMS.md

      - name: Verify the pages match their sources
        run: |
          status=0
          check_page() {
            local source="$1" target="$2" origin="$3"
            if ! python3 tools/render_legal.py --source "$source" --target "$target" --check; then
              echo "::error file=$target::$target does not match $origin in the app repo."
              echo "::error file=$target::Edit $origin there, not the generated region of this page."
              echo "::error file=$target::To refresh locally: python3 tools/render_legal.py --source <path to $origin> --target $target"
              status=1
            fi
          }
          check_page /tmp/PRIVACY.md privacy/index.html PRIVACY.md
          check_page /tmp/TERMS.md terms/index.html TERMS.md
          exit $status

  sync:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the source documents
        run: |
          curl -fsSL --retry 3 "$SOURCE_REPO/PRIVACY.md" -o /tmp/PRIVACY.md
          curl -fsSL --retry 3 "$SOURCE_REPO/TERMS.md" -o /tmp/TERMS.md

      - name: Render the pages
        run: |
          python3 tools/render_legal.py --source /tmp/PRIVACY.md --target privacy/index.html
          python3 tools/render_legal.py --source /tmp/TERMS.md --target terms/index.html

      # One commit for both pages rather than a job each, so two renders
      # cannot race each other pushing to the same branch.
      - name: Commit if either page changed
        run: |
          if git diff --quiet -- privacy/index.html terms/index.html; then
            echo "Legal pages already current; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add privacy/index.html terms/index.html
          git commit -m "Sync the legal pages with PRIVACY.md and TERMS.md

          Regenerated by .github/workflows/sync-legal.yml from
          submersion-app/submersion. Edit the Markdown there rather than the
          generated regions of these pages."
          git push
